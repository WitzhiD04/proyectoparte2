# RabbitMQ de la plataforma: clúster de 3 nodos (AD-02, Figura 2 del SAD) con la topología declarada al desplegar.

# Topología, políticas y usuarios desde un archivo (DA-03). Con esto RabbitMQ no crea el usuario guest.
definitions.import_backend = local_filesystem
definitions.local.path = /etc/rabbitmq/definiciones.json

# Formación del clúster con los nombres de los nodos de compose.
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@bus1
cluster_formation.classic_config.nodes.2 = rabbit@bus2
cluster_formation.classic_config.nodes.3 = rabbit@bus3

# Las colas quorum crecen hasta 3 miembros cuando los otros nodos se unen. Sin esto, una cola declarada por las
# definiciones antes de formarse el clúster quedaría con un solo miembro y no replicaría nada.
quorum_queue.continuous_membership_reconciliation.enabled = true
quorum_queue.continuous_membership_reconciliation.target_group_size = 3

# Los servicios se conectan desde otros contenedores.
loopback_users = none
