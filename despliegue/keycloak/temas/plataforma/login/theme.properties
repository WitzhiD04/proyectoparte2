# Tema de inicio de sesión de la plataforma: Keycloak con la identidad visual de la consola (consola/src/styles.css).
# Hereda las plantillas de keycloak.v2 y solo cambia estilos y textos, para no tener que mantener plantillas propias.
parent=keycloak.v2
import=common/keycloak
stylesCommon=vendor/patternfly-v5/patternfly.min.css vendor/patternfly-v5/patternfly-addons.css
styles=css/styles.css css/plataforma.css
# La consola no tiene modo oscuro.
darkMode=false
locales=es
