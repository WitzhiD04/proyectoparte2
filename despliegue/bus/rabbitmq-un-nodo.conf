# Un solo nodo con la misma topología. Lo usan las pruebas de integración (Testcontainers) y el desarrollo local
# cuando no hace falta el clúster. En compose y en Kubernetes se usa rabbitmq.conf (3 nodos).
definitions.import_backend = local_filesystem
definitions.local.path = /etc/rabbitmq/definiciones.json
loopback_users = none
