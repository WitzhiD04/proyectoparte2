# nginx solo sirve los archivos de la consola. La API la enruta el API Gateway (AD-04, DA-12), que está delante:
# el gateway envía aquí todo lo que no es /v1 (ruta "consola" del catálogo, solo GET y HEAD).
server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
