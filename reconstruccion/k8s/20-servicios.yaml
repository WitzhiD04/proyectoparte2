# Servicio de Reconstrucción: dos copias o más, sin sesión. Si una falla, Kubernetes la reemplaza.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reconstruccion
spec:
  replicas: 2
  selector:
    matchLabels: { app: reconstruccion }
  template:
    metadata:
      labels: { app: reconstruccion }
    spec:
      containers:
        - name: api
          image: reconstruccion-api:local
          imagePullPolicy: IfNotPresent
          env:
            - { name: Reconstruccion__Rol, value: escritura }
            - { name: RabbitMq__Host, value: bus }
            - { name: Minio__Endpoint, value: "archivos:9000" }
            - name: ConnectionStrings__Reconstruccion
              valueFrom: { secretKeyRef: { name: credenciales, key: cadena-reconstruccion } }
            - name: Minio__Usuario
              valueFrom: { secretKeyRef: { name: credenciales, key: minio-usuario } }
            - name: Minio__Clave
              valueFrom: { secretKeyRef: { name: credenciales, key: minio-clave } }
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /salud, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /salud, port: 8080 }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: reconstruccion
spec:
  selector: { app: reconstruccion }
  ports: [{ port: 8080 }]
---
# Servicio de Consulta del Programa: se aumenta solo cuando suben las consultas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consulta
spec:
  replicas: 1
  selector:
    matchLabels: { app: consulta }
  template:
    metadata:
      labels: { app: consulta }
    spec:
      containers:
        - name: api
          image: reconstruccion-api:local
          imagePullPolicy: IfNotPresent
          env:
            - { name: Reconstruccion__Rol, value: consulta }
            - { name: RabbitMq__Host, value: bus }
            - name: ConnectionStrings__Programa
              valueFrom: { secretKeyRef: { name: credenciales, key: cadena-programa } }
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /salud, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /salud, port: 8080 }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: consulta
spec:
  selector: { app: consulta }
  ports: [{ port: 8080 }]
---
# Necesita el servidor de métricas del clúster (metrics-server) para medir el uso de CPU.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: consulta
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: consulta }
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: nginx
          image: reconstruccion-web:local
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 80 }]
---
# La consola queda en http://localhost:30080
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  type: NodePort
  selector: { app: web }
  ports: [{ port: 80, nodePort: 30080 }]
