# Manifiestos comunes de la plataforma. No fija el namespace: lo fija cada overlay (local; más adelante, regiones).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 00-base.yaml
  - 10-datos.yaml
  - 20-servicios.yaml
  - evaluacion-danos.yaml
  - adaptador-se2.yaml
  - adaptador-se6.yaml
  - adaptador-se7.yaml
  - gestion-desastres.yaml
  - consulta.yaml
  - auditoria.yaml
  - consulta-danos.yaml
  - keycloak.yaml
  - gateway.yaml
configMapGenerator:
  - name: keycloak-realm
    files:
      - realm-plataforma.json=../../keycloak/realm-plataforma.json
generatorOptions:
  disableNameSuffixHash: true
