# Claves de este entorno local de pruebas (aviso A-15). En un despliegue real se crean aparte, por ejemplo con un
# gestor de secretos, y no se guardan en el repositorio. Las del bus deben coincidir con despliegue/bus/definiciones.json.
apiVersion: v1
kind: Secret
metadata:
  name: credenciales
stringData:
  postgres: postgres_local
  replicador: replicador_local
  reconstruccion-app: reconstruccion_local
  programa-app: programa_local
  cadena-reconstruccion-dueno: "Host=db;Port=5432;Database=reconstruccion;Username=postgres;Password=postgres_local"
  cadena-programa-dueno: "Host=db;Port=5432;Database=programa;Username=postgres;Password=postgres_local"
  cadena-reconstruccion: "Host=db;Port=5432;Database=reconstruccion;Username=reconstruccion_app;Password=reconstruccion_local"
  cadena-programa: "Host=db;Port=5432;Database=programa;Username=programa_app;Password=programa_local"
  evaluacion-danos-app: evaluacion_danos_local
  adaptador-se2-app: adaptador_se2_local
  cadena-evaluacion-danos-dueno: "Host=db;Port=5432;Database=evaluacion_danos;Username=postgres;Password=postgres_local"
  cadena-evaluacion-danos: "Host=db;Port=5432;Database=evaluacion_danos;Username=evaluacion_danos_app;Password=evaluacion_danos_local"
  cadena-adaptador-se2-dueno: "Host=db;Port=5432;Database=adaptador_se2;Username=postgres;Password=postgres_local"
  cadena-adaptador-se2: "Host=db;Port=5432;Database=adaptador_se2;Username=adaptador_se2_app;Password=adaptador_se2_local"
  bus-evaluacion-danos: evaluacion_danos_local
  bus-adaptador-se2: adaptador_se2_local
  adaptador-se7-app: adaptador_se7_local
  cadena-adaptador-se7-dueno: "Host=db;Port=5432;Database=adaptadores;Username=postgres;Password=postgres_local"
  cadena-adaptador-se7: "Host=db;Port=5432;Database=adaptadores;Username=adaptador_se7_app;Password=adaptador_se7_local"
  bus-adaptador-se7: adaptador_se7_local
  # KEDA mide q.salida.se7 con el usuario del adaptador. Nombre completo del servicio: el operador está en otro namespace.
  amqp-adaptador-se7: "amqp://adaptador-se7:adaptador_se7_local@bus.plataforma.svc.cluster.local:5672/%2F"
  bus-reconstruccion: reconstruccion_local
  bus-consulta-programa: consulta_programa_local
  gestion-desastres-app: gestion_desastres_local
  cadena-gestion-desastres-dueno: "Host=db;Port=5432;Database=gestion_desastres;Username=postgres;Password=postgres_local"
  cadena-gestion-desastres: "Host=db;Port=5432;Database=gestion_desastres;Username=gestion_desastres_app;Password=gestion_desastres_local"
  bus-gestion-desastres: gestion_desastres_local
  consulta-app: consulta_local
  cadena-consulta-dueno: "Host=db;Port=5432;Database=consulta;Username=postgres;Password=postgres_local"
  cadena-consulta: "Host=db;Port=5432;Database=consulta;Username=consulta_app;Password=consulta_local"
  bus-consulta: consulta_local
  auditoria-app: auditoria_local
  cadena-auditoria-dueno: "Host=db;Port=5432;Database=auditoria;Username=postgres;Password=postgres_local"
  cadena-auditoria: "Host=db;Port=5432;Database=auditoria;Username=auditoria_app;Password=auditoria_local"
  bus-auditoria: auditoria_local
  consulta-danos-app: consulta_danos_local
  cadena-consulta-danos-dueno: "Host=db;Port=5432;Database=consulta_danos;Username=postgres;Password=postgres_local"
  cadena-consulta-danos: "Host=db;Port=5432;Database=consulta_danos;Username=consulta_danos_app;Password=consulta_danos_local"
  bus-consulta-danos: consulta_danos_local
  minio-usuario: minioadmin
  minio-clave: minioadmin
  keycloak-admin: admin_local
