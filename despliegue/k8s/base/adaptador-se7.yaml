# Adaptador de SE-7, sistema de proyectos externo (DA-11), con KEDA (DT-10, AD-25: nodo de ejecución bajo demanda).
#   - sim-se7: el simulador de SE-7 (una réplica, estado en memoria).
#   - adaptador-se7-migrador: esquema se7 en la base compartida "adaptadores" (DT-19).
#   - adaptador-se7-salida: consume q.salida.se7. KEDA la escala de 0 a N por el largo de la cola.
#   - adaptador-se7-entrada: consulta SE-7 desde su marca de avance. KEDA la enciende por ventanas (trigger cron).
# Los adaptadores no llevan PodDisruptionBudget: son efímeros y pueden estar en cero (AD-25). Su estado (marca de
# avance, bandeja, mensajes procesados) vive en la base; los mensajes pendientes, en la cola.
# Requiere KEDA instalado (lo instala aplicar.sh). Sin KEDA, los Deployments quedan con su réplica fija.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sim-se7
spec:
  replicas: 1
  selector:
    matchLabels: { app: sim-se7 }
  template:
    metadata:
      labels: { app: sim-se7 }
    spec:
      containers:
        - name: simulador
          image: plataforma/sim-se7:local
          imagePullPolicy: IfNotPresent
          env:
            - { name: Simulador__IntervaloGeneracionSegundos, value: "20" }
            - { name: Simulador__RetrasoLentoMs, value: "10000" }
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /salud/vivo, port: 8080 }
            periodSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 192Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: sim-se7
spec:
  selector: { app: sim-se7 }
  ports: [{ port: 8080 }]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: adaptador-se7-migrador
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrador
          image: plataforma/adaptador-se7:local
          imagePullPolicy: IfNotPresent
          args: ["migrar"]
          env:
            - name: ConnectionStrings__AdaptadorSe7Dueno
              valueFrom: { secretKeyRef: { name: credenciales, key: cadena-adaptador-se7-dueno } }
            - name: Migracion__ClaveAdaptadorSe7App
              valueFrom: { secretKeyRef: { name: credenciales, key: adaptador-se7-app } }
---
# Salida. "replicas" es el valor inicial: con KEDA instalado, el ScaledObject manda (de 0 a 4).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adaptador-se7-salida
spec:
  replicas: 1
  selector:
    matchLabels: { app: adaptador-se7, modo: salida }
  template:
    metadata:
      labels: { app: adaptador-se7, modo: salida }
    spec:
      # Al bajar a cero, el consumidor deja de tomar mensajes y el que está en curso vuelve a la cola sin confirmarse.
      terminationGracePeriodSeconds: 30
      containers:
        - name: adaptador
          image: plataforma/adaptador-se7:local
          imagePullPolicy: IfNotPresent
          args: ["salida"]
          env:
            - { name: Bus__Nodos__0, value: bus }
            - { name: Bus__Usuario, value: adaptador-se7 }
            - { name: Bus__Productor, value: adaptador-se7 }
            - name: Bus__Clave
              valueFrom: { secretKeyRef: { name: credenciales, key: bus-adaptador-se7 } }
            - name: ConnectionStrings__AdaptadorSe7
              valueFrom: { secretKeyRef: { name: credenciales, key: cadena-adaptador-se7 } }
            - { name: Se7__Url, value: "http://sim-se7:8080/" }
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /salud/listo, port: 8080 }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /salud/vivo, port: 8080 }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 320Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adaptador-se7-entrada
spec:
  replicas: 1
  selector:
    matchLabels: { app: adaptador-se7, modo: entrada }
  template:
    metadata:
      labels: { app: adaptador-se7, modo: entrada }
    spec:
      containers:
        - name: adaptador
          image: plataforma/adaptador-se7:local
          imagePullPolicy: IfNotPresent
          args: ["entrada"]
          env:
            - { name: Bus__Nodos__0, value: bus }
            - { name: Bus__Usuario, value: adaptador-se7 }
            - { name: Bus__Productor, value: adaptador-se7 }
            - name: Bus__Clave
              valueFrom: { secretKeyRef: { name: credenciales, key: bus-adaptador-se7 } }
            - name: ConnectionStrings__AdaptadorSe7
              valueFrom: { secretKeyRef: { name: credenciales, key: cadena-adaptador-se7 } }
            - { name: Se7__Url, value: "http://sim-se7:8080/" }
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /salud/listo, port: 8080 }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /salud/vivo, port: 8080 }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 320Mi }
---
# Credenciales con las que KEDA mide la cola: el usuario del adaptador, que puede leer q.salida.se7 (mínimo privilegio).
# El operador de KEDA corre en su propio namespace, por eso la URL del secreto usa el nombre completo del servicio.
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: bus-adaptador-se7
spec:
  secretTargetRef:
    - parameter: host
      name: credenciales
      key: amqp-adaptador-se7
---
# Salida bajo demanda (DT-10): 0 réplicas con la cola vacía, una más por cada 20 mensajes listos, hasta 4.
# KEDA mide por AMQP los mensajes listos (no los que están en curso). Con SE-7 caído el adaptador pausa el consumo y
# devuelve el mensaje en curso a la cola (CompuertaConsumo): los pendientes siguen contándose como listos y queda al
# menos una réplica sondeando SE-7, que los entrega cuando el circuito se cierra (Cuadro 5, AD-36).
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: adaptador-se7-salida
spec:
  scaleTargetRef:
    name: adaptador-se7-salida
  minReplicaCount: 0
  maxReplicaCount: 4
  pollingInterval: 10
  cooldownPeriod: 120
  triggers:
    - type: rabbitmq
      metadata:
        protocol: amqp
        queueName: q.salida.se7
        mode: QueueLength
        value: "20"
        activationValue: "0"
      authenticationRef:
        name: bus-adaptador-se7
---
# Entrada por ventanas (DT-10): una réplica durante el primer minuto de cada dos; en la ventana consulta SE-7 al
# arrancar y cada 30 s, desde su marca de avance, así que nada se pierde mientras está en cero. Costo aceptado: en
# Kubernetes la latencia de un avance de SE-7 llega a ~2 min (en compose, 30 s). Para tenerla siempre encendida,
# ampliar la ventana (start "0 0 * * *", end "59 23 * * *").
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: adaptador-se7-entrada
spec:
  scaleTargetRef:
    name: adaptador-se7-entrada
  minReplicaCount: 0
  maxReplicaCount: 1
  cooldownPeriod: 30
  triggers:
    - type: cron
      metadata:
        timezone: America/Bogota
        start: "*/2 * * * *"
        end: "1-59/2 * * * *"
        desiredReplicas: "1"
