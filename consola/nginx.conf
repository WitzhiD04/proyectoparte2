# En la plataforma completa este reparto lo hace el API Gateway. Aquí nginx solo sirve la consola
# y envía cada ruta al servicio que la atiende.
server {
    listen 80;
    client_max_body_size 25m;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    proxy_next_upstream error timeout http_502 http_503 http_504;

    # El consolidado lo atiende el servicio de Consulta del Programa.
    location /v1/programa/ {
        proxy_pass http://consulta-programa:8080;
    }

    # Gestión de Desastres: operaciones sobre un desastre y catálogo. El listado exacto /v1/desastres sigue siendo de
    # Reconstrucción hasta el paso 4, que lo renombra a /v1/reconstruccion/desastres (E-09).
    location /v1/desastres/ {
        proxy_pass http://gestion-desastres:8080;
    }
    location = /v1/desastres {
        if ($request_method = GET) {
            proxy_pass http://reconstruccion:8080;
        }
        proxy_pass http://gestion-desastres:8080;
    }
    location /v1/catalogos/ {
        proxy_pass http://gestion-desastres:8080;
    }

    # Consulta: tablero, vista consolidada, mapa de zonas y estado de las integraciones (Cuadro 15).
    location /v1/consulta/ {
        proxy_pass http://consulta:8080;
    }
    location = /v1/integraciones {
        proxy_pass http://consulta:8080;
    }

    # Todo lo demás de la API lo atiende el servicio de Reconstrucción.
    location /v1/ {
        proxy_pass http://reconstruccion:8080;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
