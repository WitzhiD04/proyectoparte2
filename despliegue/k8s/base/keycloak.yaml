# Proveedor de identidad Keycloak 26 (DT-08, DA-15): importa el realm "plataforma" desde el ConfigMap keycloak-realm.
# Fija el emisor (iss) en http://localhost:8180/realms/plataforma y habilita el backchannel dinámico por http://keycloak:8080.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels: { app: keycloak }
  template:
    metadata:
      labels: { app: keycloak }
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.5.2
          args: ["start-dev", "--import-realm"]
          env:
            - { name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin }
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: credenciales, key: keycloak-admin } }
            - { name: KC_HEALTH_ENABLED, value: "true" }
            - { name: KC_HOSTNAME, value: "http://localhost:8180" }
            - { name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC, value: "true" }
          ports:
            - { name: http, containerPort: 8080 }
            - { name: management, containerPort: 9000 }
          readinessProbe:
            httpGet: { path: /health/ready, port: 9000 }
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet: { path: /health/live, port: 9000 }
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: realm, mountPath: /opt/keycloak/data/import, readOnly: true }
            - { name: tema, mountPath: /opt/keycloak/themes/plataforma/login, readOnly: true }
      volumes:
        - name: realm
          configMap: { name: keycloak-realm }
        # Tema de la pantalla de inicio de sesión (despliegue/keycloak/temas): un ConfigMap no guarda carpetas.
        - name: tema
          configMap:
            name: keycloak-tema
            items:
              - { key: theme.properties, path: theme.properties }
              - { key: messages_es.properties, path: messages/messages_es.properties }
              - { key: plataforma.css, path: resources/css/plataforma.css }
              - { key: ibm-plex-sans-latin-400-normal.woff2, path: resources/fonts/ibm-plex-sans-latin-400-normal.woff2 }
              - { key: ibm-plex-sans-latin-500-normal.woff2, path: resources/fonts/ibm-plex-sans-latin-500-normal.woff2 }
              - { key: ibm-plex-sans-latin-600-normal.woff2, path: resources/fonts/ibm-plex-sans-latin-600-normal.woff2 }
              - { key: archivo-latin-wdth-normal.woff2, path: resources/fonts/archivo-latin-wdth-normal.woff2 }
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector: { app: keycloak }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
